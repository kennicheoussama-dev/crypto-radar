<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Crypto Radar</title>
<meta name="description" content="رادار العملات الرقمية - أسعار لحظية وتنبيهات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crypto Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#17223a;--text:#f3f6ff;--muted:#9aa8c3;--line:#26334e;--green:#31d6a0;--red:#ff6b7d;--blue:#79a7ff;--gold:#ffc96b}
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#6c8cff,#35dfb0);display:grid;place-items:center;color:#091322;font-size:25px;font-weight:900}
h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}.pill{border:1px solid var(--line);background:#121a2dcc;border-radius:999px;padding:8px 12px;color:var(--muted);font-size:12px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 12px}.toolbar h3{margin:0;font-size:18px}.controls{display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 13px;font:inherit}
button:disabled{opacity:.5}button.primary{background:var(--blue);border-color:var(--blue);color:#071225;font-weight:750}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.coin{position:relative;background:linear-gradient(160deg,#151f35,#101727);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.coinicon{width:39px;height:39px;border-radius:13px;background:#243653;display:grid;place-items:center;font-weight:850;color:#d8e5ff;flex:none}
.coinhead{display:flex;align-items:center;gap:10px}.coinname{font-weight:750}.symbol{color:var(--muted);font-size:12px;margin-top:2px}
.rm{position:absolute;top:10px;left:10px;width:26px;height:26px;padding:0;border-radius:8px;font-size:12px;color:var(--muted);background:transparent;border-color:transparent}
.price{font-size:clamp(19px,2.4vw,25px);font-weight:800;margin:18px 0 8px;direction:ltr;text-align:right}
.change{font-size:13px;font-weight:750}.positive{color:var(--green)}.negative{color:var(--red)}
.spark{display:block;width:100%;height:32px;margin-top:10px}
.ind{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ind-badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:#0c1425;color:var(--muted);direction:ltr}
.ind-badge.good{color:var(--green);border-color:#31d6a04d;background:#31d6a010}
.ind-badge.bad{color:var(--red);border-color:#ff6b7d4d;background:#ff6b7d10}
.ind-badge.neutral{color:var(--blue);border-color:#79a7ff4d;background:#79a7ff10}
.section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.section h3{margin:0 0 6px;font-size:17px}
.hint{font-size:12px;color:var(--muted);line-height:1.8;margin:0 0 14px}
.formrow{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:9px;align-items:end}.formrow.coinadd{grid-template-columns:1fr auto}
.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}
.field input,.field select{width:100%;min-width:0;background:#0c1425;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}
.alerts{display:grid;gap:9px}.alert{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#0e1728;border:1px solid var(--line);border-radius:12px;padding:12px}
.alert.done{border-color:#31d6a055}.alert small{display:block;color:var(--muted);margin-top:4px}.alert .btns{display:flex;gap:6px}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-top:14px}
.dot{width:8px;height:8px;background:var(--gold);border-radius:50%}.dot.live{background:var(--green);box-shadow:0 0 10px #31d6a080}
button.small{padding:6px 10px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pill.off{color:var(--red);border-color:#ff6b7d4d}
.stale{opacity:.7}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#eaf2ff;color:#0b1426;padding:12px 18px;border-radius:12px;display:none;z-index:5;font-size:13px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.formrow{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{gap:9px}.coin{padding:12px}.formrow{grid-template-columns:1fr}.formrow button{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">↗</div><div><h1>Crypto Radar</h1><div class="sub">رادار العملات · تطبيق</div></div></div>
    <div class="pill" id="lastUpdate">جارٍ الاتصال…</div>
  </header>

  <div class="toolbar">
    <h3>قائمة المراقبة</h3>
    <div class="controls">
      <button id="refreshBtn">↻ تحديث</button>
      <button id="soundBtn">🔊 تفعيل الصوت</button>
      <button id="notifBtn">🔔 الإشعارات</button>
    </div>
  </div>
  <div class="grid" id="coins"><div class="coin"><div class="sub">جارٍ التحميل…</div></div></div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">جلب الأسعار…</span></div>

  <section class="section">
    <h3>إضافة عملة</h3>
    <div class="formrow coinadd">
      <div class="field"><label>الرمز</label><input id="newCoin" dir="ltr" placeholder="SOL"></div>
      <button class="primary" id="addCoinBtn">إضافة</button>
    </div>
  </section>

  <section class="section">
    <h3>تنبيهات الأسعار</h3>
    <div class="formrow">
      <div class="field"><label>العملة</label><select id="alertCoin"></select></div>
      <div class="field"><label>الشرط</label><select id="alertCondition"><option value="above">فوق</option><option value="below">تحت</option></select></div>
      <div class="field"><label>السعر</label><input id="alertPrice" type="number" step="any" placeholder="1.25"></div>
      <button class="primary" id="addAlert">إضافة</button>
    </div>
    <div style="height:12px"></div>
    <div class="alerts" id="alertsList"><div class="empty">لا توجد تنبيهات.</div></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const API='https://data-api.binance.vision/api/v3/';
const $=id=>document.getElementById(id);

let COINS=(()=>{try{const c=JSON.parse(localStorage.getItem('cr_coins'));if(Array.isArray(c)&&c.length)return c}catch{}return[
 {symbol:'BTCUSDT',name:'بيتكوين',short:'BTC',icon:'₿'},
 {symbol:'WLDUSDT',name:'وورلدكوين',short:'WLD',icon:'W'},
 {symbol:'PEPEUSDT',name:'بيبي',short:'PEPE',icon:'🐸'},
 {symbol:'ONDOUSDT',name:'أوندو',short:'ONDO',icon:'O'}
]})();
let market={},sparks={},indicators={},lastOk=0,refreshing=false;
let soundEnabled=false,notifEnabled=false,audioCtx=null;
loadCache();

function saveCache(){try{localStorage.setItem('cr_cache',JSON.stringify({t:lastOk,market,sparks,indicators}))}catch{}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem('cr_cache'));if(c&&c.market){market=c.market;sparks=c.sparks||{};indicators=c.indicators||{};lastOk=c.t||0}}catch{}}
function saveCoins(){try{localStorage.setItem('cr_coins',JSON.stringify(COINS))}catch{}}
function fmt(n){if(!Number.isFinite(n))return'—';return n>=1000?n.toLocaleString('en-US',{maximumFractionDigits:2}):n>=0.01?n.toLocaleString('en-US',{maximumFractionDigits:6}):n.toLocaleString('en-US',{maximumFractionDigits:10})}
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}

function calcEMA(vals, period){if(!vals.length)return[];const k=2/(period+1),out=[vals[0]];for(let i=1;i<vals.length;i++)out.push(vals[i]*k+out[i-1]*(1-k));return out}
function calcRSI(closes, period=14){if(closes.length<period+1)return null;let g=0,l=0;for(let i=1;i<=period;i++){const d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d}let ag=g/period,al=l/period;for(let i=period+1;i<closes.length;i++){const d=closes[i]-closes[i-1];ag=(ag*(period-1)+Math.max(d,0))/period;al=(al*(period-1)+Math.max(-d,0))/period}if(al===0)return 100;return 100-100/(1+ag/al)}
function calcMACD(closes){if(closes.length<35)return null;const ef=calcEMA(closes,12),es=calcEMA(closes,26),ml=[];for(let i=25;i<closes.length;i++)ml.push(ef[i]-es[i]);const sl=calcEMA(ml,9);const m=ml[ml.length-1],s=sl[sl.length-1];return{macd:m,signal:s,hist:m-s}}

function spark(arr){if(!arr||arr.length<2)return'';const w=120,h=32,min=Math.min(...arr),max=Math.max(...arr),rng=max-min||1;const pts=arr.map((v,i)=>(i/(arr.length-1)*w).toFixed(1)+','+(h-2-(v-min)/rng*(h-4)).toFixed(1)).join(' ');const up=arr[arr.length-1]>=arr[0];return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${up?'#31d6a0':'#ff6b7d'}" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}

function renderCoins(){
  const box=$('coins');
  if(!COINS.length){box.innerHTML='<div class="coin" style="grid-column:1/-1"><b>القائمة فارغة.</b></div>';return}
  box.innerHTML=COINS.map(c=>{
    const d=market[c.symbol],p=d?Number(d.lastPrice):NaN,ch=d?Number(d.priceChangePercent):NaN;
    const ind=indicators[c.symbol]||{};
    let indHtml='';
    if(ind.rsi!=null){const cls=ind.rsi>=70?'bad':ind.rsi<=30?'good':'neutral';indHtml+=`<span class="ind-badge ${cls}">RSI ${ind.rsi.toFixed(1)}</span>`}
    if(ind.macd){const cls=ind.macd.hist>=0?'good':'bad';const sign=ind.macd.hist>=0?'+':'';indHtml+=`<span class="ind-badge ${cls}">MACD ${sign}${ind.macd.hist.toFixed(4)}</span>`}
    
    return `<article class="coin"><button class="rm" data-rm="${c.symbol}" aria-label="حذف ${c.short}">✕</button><div class="coinhead"><div class="coinicon">${c.icon}</div><div><div class="coinname">${c.name}</div><div class="symbol">${c.short} / USDT</div></div></div><div class="price">${d?'$'+fmt(p):'—'}</div><div class="change ${ch>=0?'positive':'negative'}">${d?(ch>=0?'▲ +':'▼ ')+ch.toFixed(2)+'%':'…'}</div>${spark(sparks[c.symbol])}<div class="ind">${indHtml}</div></article>`;
  }).join('');
}
function fillSelect(){const s=$('alertCoin'),o=s.value;s.innerHTML=COINS.map(c=>`<option value="${c.symbol}">${c.short}</option>`).join('');if(COINS.some(c=>c.symbol===o))s.value=o}

async function refresh(){
  if(refreshing)return;if(!COINS.length)return;
  refreshing=true;$('statusText').textContent='جارٍ التحديث…';
  try{
    const syms=JSON.stringify(COINS.map(c=>c.symbol));
    const r=await fetch(API+'ticker/24hr?symbols='+encodeURIComponent(syms));
    if(!r.ok)throw 0;const arr=await r.json();
    arr.forEach(d=>{market[d.symbol]=d});
    lastOk=Date.now();saveCache();renderCoins();checkAlerts();
    $('statusDot').classList.add('live');$('lastUpdate').classList.remove('off');
    $('statusText').textContent='متصل';$('lastUpdate').textContent='آخر تحديث: '+new Date(lastOk).toLocaleTimeString('ar-DZ');
  }catch{
    $('statusDot').classList.remove('live');
    $('statusText').textContent=navigator.onLine?'تعذر الاتصال بالخادم. تُعرض آخر أسعار محفوظة.':'لا يوجد اتصال بالإنترنت. تُعرض آخر أسعار محفوظة.';
    $('lastUpdate').classList.add('off');
    $('lastUpdate').textContent=lastOk?'غير متصل · آخر تحديث '+new Date(lastOk).toLocaleTimeString('ar-DZ'):'غير متصل';
  }finally{refreshing=false}
}

async function loadSparks(){
  await Promise.allSettled(COINS.map(async c=>{
    try{
      const r=await fetch(API+'klines?symbol='+c.symbol+'&interval=1h&limit=100');
      if(!r.ok)return;const k=await r.json();
      const closes=k.map(x=>Number(x[4]));
      sparks[c.symbol]=closes.slice(-24);
      indicators[c.symbol]={rsi:calcRSI(closes,14),macd:calcMACD(closes)};
    }catch{}
  }));
  saveCache();renderCoins();
}

async function addCoin(){
  const raw=$('newCoin').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/USDT$/,'');
  if(raw.length<2){toast('رمز غير صحيح');return}
  const sym=raw+'USDT';
  if(COINS.some(c=>c.symbol===sym)){toast('موجودة');return}
  try{const r=await fetch(API+'ticker/24hr?symbol='+sym);if(!r.ok)throw 0;market[sym]=await r.json();COINS.push({symbol:sym,name:raw,short:raw,icon:raw[0]});saveCoins();fillSelect();renderCoins();$('newCoin').value='';toast('أُضيفت '+raw);loadSparks()}catch{toast('لم أجد '+raw)}
}
function removeCoin(sym){COINS=COINS.filter(c=>c.symbol!==sym);saveCoins();fillSelect();renderCoins();toast('حُذفت')}

function getAlerts(){try{return JSON.parse(localStorage.getItem('cr_alerts')||'[]')}catch{return[]}}
function saveAlerts(a){try{localStorage.setItem('cr_alerts',JSON.stringify(a))}catch{};renderAlerts()}
function renderAlerts(){
  const a=getAlerts(),e=$('alertsList');
  if(!a.length){e.innerHTML='<div class="empty">لا توجد تنبيهات.</div>';return}
  e.innerHTML=a.map(x=>{
    const c=COINS.find(z=>z.symbol===x.symbol);
    return `<div class="alert ${x.triggered?'done':''}"><div><strong>${c?c.short:x.symbol}</strong> ${x.condition==='above'?'فوق':'تحت'} $${fmt(x.price)}<small>${x.triggered?'فُعّل':'بانتظار'}</small></div><div class="btns">${x.triggered?`<button class="small" data-rearm="${x.id}">إعادة تفعيل</button>`:''}<button class="small" data-del="${x.id}">حذف</button></div></div>`;
  }).join('');
}
const isNative=!!(window.Capacitor&&typeof Capacitor.isNativePlatform==='function'&&Capacitor.isNativePlatform());
const LN=()=>isNative&&window.Capacitor.Plugins?window.Capacitor.Plugins.LocalNotifications:null;
async function showSystemNotification(title,body){
  const ln=LN();
  if(ln){try{await ln.schedule({notifications:[{id:Math.floor(Date.now()%2147483000),title,body}]});return}catch{}}
  const opts={body,icon:'icon-192.png',badge:'icon-192.png',tag:'cr-alert',dir:'rtl',lang:'ar'};
  try{
    const reg='serviceWorker'in navigator?await navigator.serviceWorker.getRegistration():null;
    if(reg){await reg.showNotification(title,opts);return}
  }catch{}
  try{new Notification(title,opts)}catch{}
}
function notify(a,p){
  const c=COINS.find(z=>z.symbol===a.symbol),n=c?c.short:a.symbol;
  toast('🔔 '+n+' = $'+fmt(p));
  if(notifEnabled&&'Notification'in window&&Notification.permission==='granted'){showSystemNotification('Crypto Radar',n+' = $'+fmt(p))}
  if(soundEnabled&&audioCtx){try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=.12;o.start();o.stop(audioCtx.currentTime+.25)}catch{}}
  if(navigator.vibrate){try{navigator.vibrate(200)}catch{}}
}
function checkAlerts(){
  const a=getAlerts();let d=false;
  a.forEach(x=>{const m=market[x.symbol];if(!m)return;const p=Number(m.lastPrice);
    if(!x.triggered&&x.last!=null){const hit=(x.condition==='above'&&x.last<x.price&&p>=x.price)||(x.condition==='below'&&x.last>x.price&&p<=x.price);if(hit){x.triggered=true;notify(x,p)}}
    if(x.last!==p){x.last=p;d=true}
  });
  if(d)saveAlerts(a);
}
$('addAlert').onclick=()=>{
  const symbol=$('alertCoin').value,condition=$('alertCondition').value,price=Number($('alertPrice').value);
  if(!Number.isFinite(price)||price<=0){toast('سعر غير صحيح');return}
  const m=market[symbol];const a=getAlerts();
  a.push({id:Date.now().toString(),symbol,condition,price,triggered:false,last:m?Number(m.lastPrice):null});
  saveAlerts(a);$('alertPrice').value='';toast('أُضيف');
};
$('alertsList').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');if(d){saveAlerts(getAlerts().filter(x=>x.id!==d.dataset.del));return}
  const r=e.target.closest('[data-rearm]');
  if(r){const a=getAlerts();const x=a.find(z=>z.id===r.dataset.rearm);if(x){const m=market[x.symbol];x.triggered=false;x.last=m?Number(m.lastPrice):null;saveAlerts(a);toast('أُعيد التفعيل')}}
});

$('soundBtn').onclick=async()=>{soundEnabled=!soundEnabled;$('soundBtn').textContent=soundEnabled?'🔊 الصوت مفعل':'🔊 تفعيل الصوت';if(soundEnabled){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume()}catch{}}toast(soundEnabled?'صوت مفعّل':'صوت مغلق')};
$('notifBtn').onclick=async()=>{
  const ln=LN();
  if(ln){
    if(notifEnabled){notifEnabled=false;$('notifBtn').textContent='🔔 الإشعارات';toast('مغلق');return}
    try{let p=await ln.checkPermissions();if(p.display!=='granted')p=await ln.requestPermissions();
      if(p.display==='granted'){notifEnabled=true;$('notifBtn').textContent='🔔 مفعّل';toast('إشعارات مفعّلة')}else toast('محجوبة')}
    catch{toast('غير مدعوم')}
    return;
  }
  if(!('Notification'in window)){toast('غير مدعوم');return}
  if(notifEnabled){notifEnabled=false;$('notifBtn').textContent='🔔 الإشعارات';toast('مغلق');return}
  let p=Notification.permission;
  if(p==='default'){try{p=await Notification.requestPermission()}catch{}}
  if(p==='granted'){notifEnabled=true;$('notifBtn').textContent='🔔 مفعّل';toast('إشعارات مفعّلة')}else toast('محجوبة');
};
$('refreshBtn').onclick=refresh;$('addCoinBtn').onclick=addCoin;
$('newCoin').addEventListener('keydown',e=>{if(e.key==='Enter')addCoin()});
$('coins').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b)removeCoin(b.dataset.rm)});

fillSelect();renderCoins();renderAlerts();refresh();loadSparks();
// Poll only while the page is visible; refresh immediately when it returns.
let tPrice=setInterval(refresh,15000),tSpark=setInterval(loadSparks,300000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){clearInterval(tPrice);clearInterval(tSpark)}
  else{refresh();loadSparks();tPrice=setInterval(refresh,15000);tSpark=setInterval(loadSparks,300000)}
});
window.addEventListener('online',()=>{toast('عاد الاتصال');refresh();loadSparks()});
window.addEventListener('offline',()=>{toast('انقطع الاتصال')});
if(!isNative&&'serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
